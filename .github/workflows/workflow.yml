name: Main workflow

on:
  pull_request:
  push:
  schedule:
    - cron: 0 0 * * 5

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    env:
      MISE_USE_VERSIONS_HOST: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache: false

      - name: Setup plugin (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.local/share/mise/plugins
          ln -s $PWD ~/.local/share/mise/plugins/graalvm

      - name: Setup plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pluginDir = "$env:LOCALAPPDATA\mise\plugins"
          New-Item -ItemType Directory -Force -Path $pluginDir
          New-Item -ItemType Junction -Path "$pluginDir\graalvm" -Target $PWD

      - name: Validate mise ls-remote works
        shell: bash
        run: |
          mise ls-remote graalvm > versions.txt
          head -20 versions.txt
          grep -E '^21\.0\.2$' versions.txt
          grep -E '^[0-9]+\.[0-9]+\.[0-9]+-java(8|11)$' versions.txt

      # GraalVM archives are only supported on Linux and macOS.
      - name: Test GraalVM installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mise i graalvm@21.0.2
          mise x graalvm@21.0.2 -- java -version 2>&1 | tee out.txt
          grep -F '21.0.2' out.txt
          mise x graalvm@21.0.2 -- sh -c 'test -n "$GRAALVM_HOME" && test "$JAVA_HOME" = "$GRAALVM_HOME" && test -x "$GRAALVM_HOME/bin/java"'

      - name: Test unsupported OS is rejected
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if mise i graalvm@21.0.2 > out.txt 2>&1; then
            echo "ERROR: install unexpectedly succeeded on Windows"
            exit 1
          fi
          cat out.txt
          grep -F 'GraalVM is not available for OS' out.txt
